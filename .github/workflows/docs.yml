name: Deploy docs

# The docs site is versioned (Docusaurus versioning) and always built from `dev`:
# - `website/docs` holds the documentation of the latest beta, shown as "Beta" in the
#   version dropdown.
# - On each stable release, the docs are snapshotted into `website/versioned_docs`
#   (see website/README.md); the latest snapshot is the default version shown to readers.
on:
  push:
    branches: [dev]
    paths: [website/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
